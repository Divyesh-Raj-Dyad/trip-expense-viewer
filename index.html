<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Expenses">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0069c0">
<meta name="robots" content="noindex">
<title>Trip Expenses</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230069c0'/%3E%3Ctext x='90' y='120' font-size='96' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#e5e9f0;
  --accent:#0069c0; --on-accent:#ffffff; --good:#15803d; --bad:#b91c1c;
  --good-bg:#e7f6ec; --bad-bg:#fdeaea; --neutral-bg:#eef2f7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --card:#18202a; --ink:#e6ebf2; --muted:#93a1b3; --line:#27313d;
    --accent:#4da3ff; --on-accent:#06182b; --good:#4ade80; --bad:#f87171;
    --good-bg:#12301d; --bad-bg:#3a1618; --neutral-bg:#212b37;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));}
main{max-width:640px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.total{background:var(--accent);color:var(--on-accent);border-color:transparent}
.total .label{opacity:.85;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.total .value{font-size:34px;font-weight:700;margin-top:2px}
.total .meta{opacity:.85;font-size:13px;margin-top:2px}
.me{display:flex;gap:10px;align-items:center;margin-top:14px}
.me label{color:var(--muted);font-size:14px;white-space:nowrap}
.me select{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.mine{margin-top:12px;border-radius:14px;padding:14px 16px}
.mine.good{background:var(--good-bg);color:var(--good)}
.mine.bad{background:var(--bad-bg);color:var(--bad)}
.mine.even{background:var(--neutral-bg);color:var(--muted)}
.mine .big{font-size:26px;font-weight:700}
.mine ul{margin:6px 0 0;padding-left:18px;color:var(--ink);font-size:15px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .r small{display:block;color:var(--muted);font-size:12px}
.good-t{color:var(--good)} .bad-t{color:var(--bad)} .muted-t{color:var(--muted)}
.arrow{color:var(--muted);padding:0 4px}
.empty{text-align:center;padding:40px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:28px}
.hi{background:var(--neutral-bg);margin:0 -16px;padding-left:16px;padding-right:16px}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
  var app = document.getElementById('app');
  var KEY = 'trip-viewer-last', ME = 'trip-viewer-me';

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function store(get, k, v){
    try { if (get) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (x) {}
    return null;
  }
  function decode(hash){
    var b64 = hash.replace(/-/g,'+').replace(/_/g,'/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }

  function load(){
    var h = location.hash.replace(/^#/, '') || window.TRIP_PAYLOAD || '';
    if (h) {
      try { var d = decode(h); store(false, KEY, h); return {data:d, fresh:true}; } catch (e) { return {error:true}; }
    }
    var last = store(true, KEY);
    if (last) { try { return {data:decode(last), fresh:false}; } catch (e) {} }
    return {};
  }

  function money(cur){
    var prefix = cur || '';
    if (prefix.length > 1 && /[A-Za-z]$/.test(prefix)) prefix += ' ';
    return function(c){
      var v = (Math.abs(c) / 100).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
      return (c < 0 ? '-' : '') + prefix + v;
    };
  }

  function render(){
    var r = load();
    app.textContent = '';
    if (!r.data) {
      var emp = el('div', 'card empty');
      emp.appendChild(el('b', '', r.error ? 'This link looks incomplete' : 'No trip to show yet'));
      emp.appendChild(el('span', '', r.error
        ? 'Ask your friend to send the share link again.'
        : 'Open the link your friend sent you in iMessage.'));
      app.appendChild(emp);
      return;
    }
    var d = r.data, fmt = money(d.c);
    var people = (d.p || []).map(function(p){ return {name:p[0], paid:p[1], share:p[2], bal:p[1]-p[2]}; });
    var transfers = (d.x || []).map(function(x){ return {from:x[0], to:x[1], c:x[2]}; });
    var exps = d.e || [];

    app.appendChild(el('h1', '', d.n || 'Trip expenses'));
    app.appendChild(el('p', 'sub', 'View only' + (d.u ? ' · updated ' + d.u : '') + (r.fresh ? '' : ' · saved copy')));

    var tot = el('div', 'card total');
    tot.appendChild(el('div', 'label', 'Total trip expense'));
    tot.appendChild(el('div', 'value', fmt(d.t || 0)));
    var avg = people.length ? Math.round((d.t || 0) / people.length) : 0;
    tot.appendChild(el('div', 'meta', exps.length + ' expense' + (exps.length === 1 ? '' : 's') + ' · ' + people.length + ' people · avg ' + fmt(avg) + ' each'));
    app.appendChild(tot);

    // "Who are you?" picker
    var me = store(true, ME) || '';
    var meBox = el('div', 'me');
    var lab = el('label', '', 'I am');
    lab.htmlFor = 'who';
    var sel = el('select'); sel.id = 'who';
    var o0 = el('option', '', 'Choose your name…'); o0.value = ''; sel.appendChild(o0);
    people.forEach(function(p){ var o = el('option', '', p.name); o.value = p.name; if (p.name === me) o.selected = true; sel.appendChild(o); });
    sel.onchange = function(){ store(false, ME, sel.value); render(); };
    meBox.appendChild(lab); meBox.appendChild(sel);
    app.appendChild(meBox);

    var mine = people.filter(function(p){ return p.name === me; })[0];
    if (mine) {
      var box = el('div', 'mine ' + (mine.bal > 0 ? 'good' : mine.bal < 0 ? 'bad' : 'even'));
      box.appendChild(el('div', '', mine.bal > 0 ? 'You get back' : mine.bal < 0 ? 'You owe' : 'You are all settled'));
      if (mine.bal !== 0) box.appendChild(el('div', 'big', fmt(Math.abs(mine.bal))));
      var list = el('ul');
      transfers.forEach(function(t){
        if (t.from === me) list.appendChild(el('li', '', 'Pay ' + t.to + ' ' + fmt(t.c)));
        if (t.to === me) list.appendChild(el('li', '', t.from + ' pays you ' + fmt(t.c)));
      });
      if (list.children.length) box.appendChild(list);
      var line = el('div', '', 'You paid ' + fmt(mine.paid) + ' · your share ' + fmt(mine.share));
      line.style.cssText = 'font-size:13px;margin-top:6px;color:var(--ink);opacity:.8';
      box.appendChild(line);
      app.appendChild(box);
    }

    // Settlement
    app.appendChild(el('h2', '', 'Who pays whom'));
    var sc = el('div', 'card');
    if (!transfers.length) sc.appendChild(el('div', 'muted-t', exps.length ? 'Everyone is settled up.' : 'No expenses yet.'));
    transfers.forEach(function(t){
      var row = el('div', 'row' + (t.from === me || t.to === me ? ' hi' : ''));
      var l = el('div', 'l'); var tt = el('div', 't');
      tt.appendChild(document.createTextNode(t.from));
      tt.appendChild(el('span', 'arrow', '→'));
      tt.appendChild(document.createTextNode(t.to));
      l.appendChild(tt);
      row.appendChild(l);
      row.appendChild(el('div', 'r t', fmt(t.c)));
      sc.appendChild(row);
    });
    app.appendChild(sc);

    // Per person
    app.appendChild(el('h2', '', 'Each person'));
    var pc = el('div', 'card');
    people.forEach(function(p){
      var row = el('div', 'row' + (p.name === me ? ' hi' : ''));
      var l = el('div', 'l');
      l.appendChild(el('div', 't', p.name));
      l.appendChild(el('div', 's', 'Paid ' + fmt(p.paid) + ' · Share ' + fmt(p.share)));
      var rr = el('div', 'r');
      var cls = p.bal > 0 ? 'good-t' : p.bal < 0 ? 'bad-t' : 'muted-t';
      rr.appendChild(el('div', 't ' + cls, p.bal > 0 ? '+' + fmt(p.bal) : p.bal < 0 ? '-' + fmt(-p.bal) : fmt(0)));
      rr.appendChild(el('small', '', p.bal > 0 ? 'gets back' : p.bal < 0 ? 'owes' : 'settled'));
      row.appendChild(l); row.appendChild(rr);
      pc.appendChild(row);
    });
    app.appendChild(pc);

    // Expenses
    app.appendChild(el('h2', '', 'All expenses'));
    var ec = el('div', 'card');
    if (!exps.length) ec.appendChild(el('div', 'muted-t', 'No expenses yet.'));
    exps.forEach(function(e, i){
      var row = el('div', 'row');
      var l = el('div', 'l');
      l.appendChild(el('div', 't', (i + 1) + '. ' + e[0]));
      l.appendChild(el('div', 's', 'Paid by ' + e[1] + ' · split ' + e[3] + ' way' + (e[3] === 1 ? '' : 's') + ' (' + e[6] + ')'));
      var rr = el('div', 'r');
      rr.appendChild(el('div', 't', fmt(e[2])));
      rr.appendChild(el('small', '', (e[5] ? '≈ ' : '') + fmt(e[4]) + ' each'));
      row.appendChild(l); row.appendChild(rr);
      ec.appendChild(row);
    });
    app.appendChild(ec);

    app.appendChild(el('p', 'foot', 'Read-only snapshot. Ask the trip organiser for a new link after changes.'));
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
